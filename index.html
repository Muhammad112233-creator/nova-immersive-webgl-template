    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />

      rel="stylesheet"
    />

    <style>
      /* ===================================================================
         Critical, inline, pre-bundle styles.

         The one job here is: never show a white flash. The page paints the
         brand gradient on the very first layout, behind a transparent WebGL
         canvas, so the handoff from DOM to GL is seamless.
         =================================================================== */
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background-color: #121636; /* base — never a white pre-paint */
      }

      /* The gradient lives on a dedicated fixed div BEHIND the canvas
         (z 0 < canvas z 1). It mirrors the procedural gradient the WebGL
         background pass draws, so it shows through the transparent canvas
         during boot and is then covered seamlessly by the GL version.

         Why fixed and not on <body>: position:fixed inset:0 is sized to the
         viewport from the first layout, independent of document flow, so it
         paints immediately. */
      #bg-gradient {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-color: #121636;
        background-image: radial-gradient(
          ellipse 126.7vw 143.4vh at 50% 130%,
          rgb(226, 232, 255) 15.855%,
          rgb(196, 206, 246) 26.169%,
          rgb(163, 176, 234) 36.483%,
          rgb(128, 143, 219) 46.797%,
          rgb(96, 111, 198) 57.111%,
          rgb(52, 62, 126) 78.555%,
          rgb(18, 22, 54) 100%
        );
      }

      /* Placeholder counter painted on the first layout so the bottom-left
         "99" is already there while WebGL boots. Uses svh (small viewport)
         units, NOT vh: the canvas counter sizes from window.innerHeight,
         which on phones equals the small viewport while the URL bar shows —
         plain vh would render bigger/lower than the canvas version and the
         mismatch reads as the number being clipped. */
      #pre-canvas-99 {
        position: fixed;
        left: 2.0833vw; /* 40 / 1920 */
        bottom: 3.7037vh; /* 40 / 1080 (fallback) */
        bottom: 3.7037svh;
        z-index: 0;
        pointer-events: none;
        user-select: none;
        font:
          700 16.667vh/1 "Space Mono",
          monospace; /* 180 / 1080 */
        font-size: 16.667svh;
        color: #ffffff;
      }
      @media (max-width: 767px) {
        #pre-canvas-99 {
          left: 4.1667vw; /* 80 / 1920 */
          font-size: 10.185vh; /* 110 / 1080 (fallback) */
          font-size: 10.185svh;
        }
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: transparent;
      }
      #webgl {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: auto;
        touch-action: none;
      }
      #ui-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
      }

      /* Shown only if JS is unavailable. */
      .noscript-note {
        position: fixed;
        inset: auto 0 0 0;
        padding: 18px 24px;
        background: #121636;
        color: #e2e8ff;
        font:
          400 15px/1.5 system-ui,
          sans-serif;
        text-align: center;
        z-index: 9999;
      }
    </style>
  </head>

  <body class="webgl-loader-overlay">
    <div id="bg-gradient" aria-hidden="true"></div>
    <div id="pre-canvas-99" aria-hidden="true">99</div>

    <canvas
      id="webgl"
      role="img"
      aria-label="NOVA interactive 3D experience"
    ></canvas>
    <div id="ui-container" role="region" aria-label="Interface controls"></div>

    <noscript>
      <p class="noscript-note">
        NOVA is an interactive WebGL experience and needs JavaScript enabled.
      </p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
